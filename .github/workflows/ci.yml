name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test # includes the token contrast/completeness check (ADR 0017)
      - run: pnpm build
      # Accuracy report (§10): printed in the log and kept as a Markdown artifact for the README.
      - run: pnpm --filter @panchang/engine accuracy
        env:
          ACCURACY_REPORT: ${{ github.workspace }}/accuracy-report.md
      - uses: actions/upload-artifact@v7
        with:
          name: accuracy-report
          path: accuracy-report.md

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @panchang/app exec playwright install --with-deps chromium
      # Onboarding, Today, Month, family date + .ics, worker smoke, offline, axe, budgets.
      - run: pnpm --filter @panchang/app e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: apps/app/test-results
